services:
  postgres:
    image: postgres:18.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: larexdb
      POSTGRES_USER: ${POSTGRES_USER:-larex_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-larex_prod} -d larexdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_USER: ${POSTGRES_USER:-larex_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      KEYCLOAK_RESOURCE_CLIENT_ID: ${KEYCLOAK_RESOURCE_CLIENT_ID:-larex-backend}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-change-me}
      KEYCLOAK_ACTION_EMAIL_CLIENT_ID: ${KEYCLOAK_ACTION_EMAIL_CLIENT_ID:-larex-frontend}
      KEYCLOAK_ACTION_EMAIL_REDIRECT_URI: ${KEYCLOAK_ACTION_EMAIL_REDIRECT_URI:-https://${LAREX_PUBLIC_HOST:-app.example.org}/auth/keycloak}
      KEYCLOAK_ACTION_EMAIL_LIFESPAN_SECONDS: ${KEYCLOAK_ACTION_EMAIL_LIFESPAN_SECONDS:-43200}
      KEYCLOAK_ADMIN_SERVER_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_REALM:-larex-prod}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:-https://${KEYCLOAK_PUBLIC_HOST:-auth.example.org}/realms/${KEYCLOAK_REALM:-larex-prod}}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:-http://keycloak:8080/realms/${KEYCLOAK_REALM:-larex-prod}/protocol/openid-connect/certs}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-https://${LAREX_PUBLIC_HOST:-app.example.org}}
      MAIL_HOST: ${MAIL_HOST:-smtp.example.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@example.com}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL_ENABLE:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      LAREX_USER_PROVISIONING_MODE: ${LAREX_USER_PROVISIONING_MODE:-LOCAL}
      LAREX_UPLOAD_DIR: ${LAREX_UPLOAD_DIR:-/mnt/data/uploads}
      LAREX_UPLOAD_TEMP_DIR: ${LAREX_UPLOAD_TEMP_DIR:-/mnt/data/uploads/temp}
      LAREX_UPLOAD_STARTUP_FAIL_FAST: ${LAREX_UPLOAD_STARTUP_FAIL_FAST:-true}
    volumes:
      - app_data:/mnt/data
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health || true); [ \"$$code\" = \"200\" ] || [ \"$$code\" = \"401\" ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-replace-with-random-32-plus-character-secret}
      NUXT_API_BASE_INTERNAL: ${NUXT_API_BASE_INTERNAL:-http://app:8080/api/v1}
      NUXT_OAUTH_KEYCLOAK_SERVER_URL: ${NUXT_OAUTH_KEYCLOAK_SERVER_URL:-https://${KEYCLOAK_PUBLIC_HOST:-auth.example.org}}
      NUXT_OAUTH_KEYCLOAK_SERVER_URL_INTERNAL: ${NUXT_OAUTH_KEYCLOAK_SERVER_URL_INTERNAL:-http://keycloak:8080}
      NUXT_OAUTH_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-larex-prod}
      NUXT_OAUTH_KEYCLOAK_CLIENT_ID: ${NUXT_OAUTH_KEYCLOAK_CLIENT_ID:-larex-frontend}
      NUXT_OAUTH_KEYCLOAK_CLIENT_SECRET: ${NUXT_OAUTH_KEYCLOAK_CLIENT_SECRET:-change-me}
      NUXT_OAUTH_KEYCLOAK_REDIRECT_URL: ${NUXT_OAUTH_KEYCLOAK_REDIRECT_URL:-https://${LAREX_PUBLIC_HOST:-app.example.org}/auth/keycloak}
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health/backend').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  app_data:
