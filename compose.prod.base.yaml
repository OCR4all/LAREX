services:
  postgres:
    image: postgres:18.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-larex_backend}
      POSTGRES_USER: ${POSTGRES_USER:-larex_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-larex_prod} -d ${POSTGRES_DB:-larex_backend}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ${LAREX_BACKEND_IMAGE:-ghcr.io/ocr4all/larex/backend:${LAREX_IMAGE_TAG:-latest}}
    restart: unless-stopped
    environment:
      LAREX_INSTANCE_NAME: ${LAREX_INSTANCE_NAME:-LAREX}
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_DB: ${POSTGRES_DB:-larex_backend}
      POSTGRES_USER: ${POSTGRES_USER:-larex_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      KEYCLOAK_RESOURCE_CLIENT_ID: ${KEYCLOAK_RESOURCE_CLIENT_ID:-larex-backend}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-change-me}
      KEYCLOAK_ACTION_EMAIL_CLIENT_ID: ${KEYCLOAK_ACTION_EMAIL_CLIENT_ID:-larex-frontend}
      KEYCLOAK_ACTION_EMAIL_REDIRECT_URI: ${KEYCLOAK_ACTION_EMAIL_REDIRECT_URI:-https://${LAREX_PUBLIC_HOST:-app.example.org}/auth/keycloak}
      KEYCLOAK_ACTION_EMAIL_LIFESPAN_SECONDS: ${KEYCLOAK_ACTION_EMAIL_LIFESPAN_SECONDS:-43200}
      KEYCLOAK_ADMIN_SERVER_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_REALM:-larex-prod}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:-https://${KEYCLOAK_PUBLIC_HOST:-auth.example.org}/realms/${KEYCLOAK_REALM:-larex-prod}}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:-http://keycloak:8080/realms/${KEYCLOAK_REALM:-larex-prod}/protocol/openid-connect/certs}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-https://${LAREX_PUBLIC_HOST:-app.example.org}}
      MAIL_HOST: ${MAIL_HOST:-smtp.example.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@example.com}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL_ENABLE:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      LAREX_USER_PROVISIONING_MODE: ${LAREX_USER_PROVISIONING_MODE:-LOCAL}
      LAREX_UPLOAD_DIR: ${LAREX_UPLOAD_DIR:-/mnt/data/uploads}
      LAREX_UPLOAD_TEMP_DIR: ${LAREX_UPLOAD_TEMP_DIR:-/mnt/data/uploads/temp}
      LAREX_UPLOAD_STARTUP_FAIL_FAST: ${LAREX_UPLOAD_STARTUP_FAIL_FAST:-true}
      LAREX_ASYNC_REQUEST_TIMEOUT: ${LAREX_ASYNC_REQUEST_TIMEOUT:-30m}
      LAREX_BACKUP_ENABLED: ${LAREX_BACKUP_ENABLED:-true}
      LAREX_BACKUP_ALLOWED_PATHS: ${LAREX_BACKUP_ALLOWED_PATHS:-/mnt/data,/uploads}
      LAREX_BACKUP_OUTPUT_DIR: ${LAREX_BACKUP_OUTPUT_DIR:-/mnt/data/backups}
      LAREX_BACKUP_MAX_FILES_PER_JOB: ${LAREX_BACKUP_MAX_FILES_PER_JOB:-500000}
      LAREX_BACKUP_MAX_ARCHIVE_BYTES: ${LAREX_BACKUP_MAX_ARCHIVE_BYTES:-21474836480}
      LAREX_BACKUP_MAX_ARCHIVE_ENTRIES: ${LAREX_BACKUP_MAX_ARCHIVE_ENTRIES:-500000}
      LAREX_BACKUP_MAX_ARCHIVE_ENTRY_BYTES: ${LAREX_BACKUP_MAX_ARCHIVE_ENTRY_BYTES:-5368709120}
      LAREX_BACKUP_MAX_ARCHIVE_TOTAL_BYTES: ${LAREX_BACKUP_MAX_ARCHIVE_TOTAL_BYTES:-107374182400}
      LAREX_BACKUP_MAX_ARCHIVE_COMPRESSION_RATIO: ${LAREX_BACKUP_MAX_ARCHIVE_COMPRESSION_RATIO:-200}
      LAREX_PROJECT_PACKAGE_MAX_ARCHIVE_BYTES: ${LAREX_PROJECT_PACKAGE_MAX_ARCHIVE_BYTES:-134217728}
      LAREX_PROJECT_PACKAGE_MAX_ENTRIES: ${LAREX_PROJECT_PACKAGE_MAX_ENTRIES:-100000}
      LAREX_PROJECT_PACKAGE_MAX_ENTRY_BYTES: ${LAREX_PROJECT_PACKAGE_MAX_ENTRY_BYTES:-536870912}
      LAREX_PROJECT_PACKAGE_MAX_TOTAL_BYTES: ${LAREX_PROJECT_PACKAGE_MAX_TOTAL_BYTES:-2147483648}
      LAREX_PROJECT_PACKAGE_MAX_DESCRIPTOR_BYTES: ${LAREX_PROJECT_PACKAGE_MAX_DESCRIPTOR_BYTES:-16777216}
      LAREX_PROJECT_PACKAGE_MAX_COMPRESSION_RATIO: ${LAREX_PROJECT_PACKAGE_MAX_COMPRESSION_RATIO:-200}
      LAREX_PROJECT_PACKAGE_PREVIEW_MAX_CACHED_BYTES: ${LAREX_PROJECT_PACKAGE_PREVIEW_MAX_CACHED_BYTES:-4294967296}
      LAREX_PROJECT_PACKAGE_PREVIEW_MAX_SESSIONS: ${LAREX_PROJECT_PACKAGE_PREVIEW_MAX_SESSIONS:-64}
      LAREX_PROJECT_PACKAGE_PREVIEW_EXPIRE_MINUTES: ${LAREX_PROJECT_PACKAGE_PREVIEW_EXPIRE_MINUTES:-30}
      LAREX_IIIF_DOWNLOAD_MIN_INTERVAL_MS: ${LAREX_IIIF_DOWNLOAD_MIN_INTERVAL_MS:-100}
      LAREX_IIIF_MAX_IMAGE_DOWNLOAD_BYTES: ${LAREX_IIIF_MAX_IMAGE_DOWNLOAD_BYTES:-536870912}
      LAREX_IIIF_PREVIEW_ASYNC_CORE_POOL: ${LAREX_IIIF_PREVIEW_ASYNC_CORE_POOL:-2}
      LAREX_IIIF_PREVIEW_ASYNC_MAX_POOL: ${LAREX_IIIF_PREVIEW_ASYNC_MAX_POOL:-4}
      LAREX_IIIF_PREVIEW_ASYNC_QUEUE: ${LAREX_IIIF_PREVIEW_ASYNC_QUEUE:-100}
      LAREX_IIIF_DOWNLOAD_ASYNC_CORE_POOL: ${LAREX_IIIF_DOWNLOAD_ASYNC_CORE_POOL:-1}
      LAREX_IIIF_DOWNLOAD_ASYNC_MAX_POOL: ${LAREX_IIIF_DOWNLOAD_ASYNC_MAX_POOL:-2}
      LAREX_IIIF_DOWNLOAD_ASYNC_QUEUE: ${LAREX_IIIF_DOWNLOAD_ASYNC_QUEUE:-50}
      LAREX_IIIF_WORKER_LEASE_DURATION_MS: ${LAREX_IIIF_WORKER_LEASE_DURATION_MS:-120000}
      LAREX_IIIF_WORKER_HEARTBEAT_INTERVAL_MS: ${LAREX_IIIF_WORKER_HEARTBEAT_INTERVAL_MS:-30000}
      LAREX_IIIF_WORKER_RECOVERY_INTERVAL_MS: ${LAREX_IIIF_WORKER_RECOVERY_INTERVAL_MS:-5000}
      LAREX_ACTIONS_PUBLIC_BASE_URL: ${LAREX_ACTIONS_PUBLIC_BASE_URL:-}
      LAREX_ACTION_OUTPUT_SHARE_PUBLIC_BASE_URL: ${LAREX_ACTION_OUTPUT_SHARE_PUBLIC_BASE_URL:-https://${LAREX_PUBLIC_HOST:-app.example.org}/api/public/action-outputs}
      LAREX_ACTIONS_PUBLIC_BASE_URL_ALLOWED_ORIGINS: ${LAREX_ACTIONS_PUBLIC_BASE_URL_ALLOWED_ORIGINS:-}
      LAREX_ACTIONS_PUBLIC_BASE_URL_REQUIRE_HTTPS: ${LAREX_ACTIONS_PUBLIC_BASE_URL_REQUIRE_HTTPS:-true}
      LAREX_ACTIONS_ENDPOINT_ALLOWED_ORIGINS: ${LAREX_ACTIONS_ENDPOINT_ALLOWED_ORIGINS:-}
      LAREX_ACTIONS_ENDPOINT_REQUIRE_HTTPS: ${LAREX_ACTIONS_ENDPOINT_REQUIRE_HTTPS:-true}
      LAREX_ACTIONS_ENDPOINT_ALLOW_INSECURE_LOCAL: ${LAREX_ACTIONS_ENDPOINT_ALLOW_INSECURE_LOCAL:-true}
      LAREX_ACTION_ENDPOINT_SECRET_ENCRYPTION_KEY: ${LAREX_ACTION_ENDPOINT_SECRET_ENCRYPTION_KEY:-}
      LAREX_NOTIFICATIONS_BRIDGE_SECRET: ${LAREX_NOTIFICATIONS_BRIDGE_SECRET:-change-me}
    volumes:
      - app_data:/mnt/data
      - ${LAREX_BACKUP_MOUNT_SOURCE:-backup_data}:/mnt/data/backups
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health || true); [ \"$$code\" = \"200\" ] || [ \"$$code\" = \"401\" ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${LAREX_FRONTEND_IMAGE:-ghcr.io/ocr4all/larex/frontend:${LAREX_IMAGE_TAG:-latest}}
    restart: unless-stopped
    environment:
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-replace-with-random-32-plus-character-secret}
      NUXT_API_BASE_INTERNAL: ${NUXT_API_BASE_INTERNAL:-http://app:8080/api/v1}
      NUXT_OAUTH_KEYCLOAK_SERVER_URL: ${NUXT_OAUTH_KEYCLOAK_SERVER_URL:-https://${KEYCLOAK_PUBLIC_HOST:-auth.example.org}}
      NUXT_OAUTH_KEYCLOAK_SERVER_URL_INTERNAL: ${NUXT_OAUTH_KEYCLOAK_SERVER_URL_INTERNAL:-http://keycloak:8080}
      NUXT_OAUTH_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-larex-prod}
      NUXT_OAUTH_KEYCLOAK_CLIENT_ID: ${NUXT_OAUTH_KEYCLOAK_CLIENT_ID:-larex-frontend}
      NUXT_OAUTH_KEYCLOAK_CLIENT_SECRET: ${NUXT_OAUTH_KEYCLOAK_CLIENT_SECRET:-change-me}
      NUXT_OAUTH_KEYCLOAK_REDIRECT_URL: ${NUXT_OAUTH_KEYCLOAK_REDIRECT_URL:-https://${LAREX_PUBLIC_HOST:-app.example.org}/auth/keycloak}
      NUXT_NOTIFICATION_BRIDGE_SECRET: ${NUXT_NOTIFICATION_BRIDGE_SECRET:-change-me}
      NUXT_COLLABORATION_SECRET: ${NUXT_COLLABORATION_SECRET:-change-me}
      NUXT_PUBLIC_INSTANCE_NAME: ${LAREX_INSTANCE_NAME:-LAREX}
      NUXT_PUBLIC_DOCUMENTATION_URL: ${NUXT_PUBLIC_DOCUMENTATION_URL:-https://docs.larex.kallimachos.de}
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health/backend').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  app_data:
  backup_data:
