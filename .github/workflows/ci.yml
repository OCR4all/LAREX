name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_MAX_OLD_SPACE_SIZE: 6144
  NODE_VERSION: 22

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: larex_user
          POSTGRES_PASSWORD: larex_password
          POSTGRES_DB: larex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Run tests
        working-directory: backend
        run: ./gradlew test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/larex_test
          SPRING_DATASOURCE_USERNAME: larex_user
          SPRING_DATASOURCE_PASSWORD: larex_password

      - name: Build JAR
        working-directory: backend
        run: ./gradlew build -x test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: backend/build/reports/tests/

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Run linting
        working-directory: frontend
        run: pnpm lint

      - name: Run type checking
        working-directory: frontend
        run: pnpm typecheck

      - name: Run tests
        working-directory: frontend
        run: pnpm test

      - name: Build
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=${{ env.NODE_MAX_OLD_SPACE_SIZE }}
        run: pnpm build

  keycloak-theme:
    name: Keycloak Theme Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: keycloak-theme/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: keycloak-theme
        run: pnpm install --frozen-lockfile

      - name: Build theme
        working-directory: keycloak-theme
        run: pnpm run build-keycloak-theme

      - name: Upload theme artifact
        uses: actions/upload-artifact@v7
        with:
          name: keycloak-theme
          path: keycloak-theme/dist_keycloak/

  docs:
    name: Docs Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: docs
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build

  compose-validation:
    name: Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate local dev compose
        run: docker compose -f compose.yaml config >/dev/null

      - name: Validate local dev compose with official Actions
        run: |
          docker compose --env-file deployment/env/.env.actions.example \
            -f compose.yaml \
            -f compose.actions.yaml \
            --profile actions \
            config >/dev/null

      - name: Validate local production-like compose
        run: |
          docker compose --env-file deployment/env/.env.prod.local.example \
            -f compose.prod.base.yaml \
            -f compose.prod.auth.bundled-keycloak.yaml \
            -f compose.prod.local.yaml \
            config >/dev/null

      - name: Validate local production-like compose with official Actions
        run: |
          docker compose \
            --env-file deployment/env/.env.prod.local.example \
            --env-file deployment/env/.env.actions.example \
            -f compose.prod.base.yaml \
            -f compose.prod.auth.bundled-keycloak.yaml \
            -f compose.prod.local.yaml \
            -f compose.actions.yaml \
            --profile actions \
            config >/dev/null

      - name: Validate production compose with bundled Keycloak
        run: |
          docker compose --env-file deployment/env/.env.prod.example \
            -f compose.prod.base.yaml \
            -f compose.prod.auth.bundled-keycloak.yaml \
            -f compose.prod.publish.localhost.yaml \
            config >/dev/null

      - name: Validate production compose with official Actions
        run: |
          docker compose \
            --env-file deployment/env/.env.prod.example \
            --env-file deployment/env/.env.actions.example \
            -f compose.prod.base.yaml \
            -f compose.prod.auth.bundled-keycloak.yaml \
            -f compose.prod.publish.localhost.yaml \
            -f compose.actions.yaml \
            --profile actions \
            config >/dev/null

      - name: Validate production compose with external Keycloak
        run: |
          docker compose --env-file deployment/env/.env.prod.example \
            -f compose.prod.base.yaml \
            -f compose.prod.auth.external-keycloak.yaml \
            -f compose.prod.publish.localhost.yaml \
            config >/dev/null

      - name: Validate production compose with bundled Nginx
        run: |
          docker compose --env-file deployment/env/.env.prod.example \
            -f compose.prod.base.yaml \
            -f compose.prod.auth.bundled-keycloak.yaml \
            -f compose.prod.publish.localhost.yaml \
            -f compose.prod.nginx.yaml \
            config >/dev/null

      - name: Check for removed deployment references
        run: |
          if grep -R -n -E 'compose\.prod\.traefik\.yaml|compose\.prod\.external-keycloak\.yaml|\.env\.prod\.traefik\.example|\.env\.prod\.external-keycloak\.example|API_HOSTNAME|compose\.prod\.local\.nginx\.yaml|compose\.prod\.kraken\.yaml|compose\.kraken\.yaml|kraken-local-test\.sh' README.md docs Taskfile.yml; then
            echo "Found stale deployment references"
            exit 1
          fi

  instance-backup-drill:
    name: Instance Backup Restore Drill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start drill services
        run: docker compose -f scripts/testdata/compose.instance-backup-drill.yaml up -d --wait

      - name: Seed database and application volume
        run: |
          docker compose -f scripts/testdata/compose.instance-backup-drill.yaml \
            exec -T postgres psql -U larex_drill -d larex_drill -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE restore_drill (value text NOT NULL)" \
            -c "INSERT INTO restore_drill VALUES ('before')"
          docker compose -f scripts/testdata/compose.instance-backup-drill.yaml \
            exec -T app sh -ec 'printf before > /mnt/data/restore-drill.txt'
          docker compose -f scripts/testdata/compose.instance-backup-drill.yaml \
            exec -T keycloak-postgres psql -U keycloak_drill -d keycloak_drill -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE restore_drill (value text NOT NULL)" \
            -c "INSERT INTO restore_drill VALUES ('before')"
          docker compose -f scripts/testdata/compose.instance-backup-drill.yaml \
            exec -T keycloak sh -ec 'printf before > /opt/keycloak/data/restore-drill.txt'

      - name: Create and verify snapshot
        run: |
          ./scripts/larex-instance-backup.sh create \
            --compose-file scripts/testdata/compose.instance-backup-drill.yaml \
            --auth-mode bundled \
            --output "${RUNNER_TEMP}/larex-drill.tar.gz"
          ./scripts/larex-instance-backup.sh verify "${RUNNER_TEMP}/larex-drill.tar.gz"

      - name: Mutate and restore
        run: |
          docker compose -f scripts/testdata/compose.instance-backup-drill.yaml \
            exec -T postgres psql -U larex_drill -d larex_drill -v ON_ERROR_STOP=1 \
            -c "UPDATE restore_drill SET value = 'after'"
          docker compose -f scripts/testdata/compose.instance-backup-drill.yaml \
            exec -T app sh -ec 'printf after > /mnt/data/restore-drill.txt'
          docker compose -f scripts/testdata/compose.instance-backup-drill.yaml \
            exec -T keycloak-postgres psql -U keycloak_drill -d keycloak_drill -v ON_ERROR_STOP=1 \
            -c "UPDATE restore_drill SET value = 'after'"
          docker compose -f scripts/testdata/compose.instance-backup-drill.yaml \
            exec -T keycloak sh -ec 'printf after > /opt/keycloak/data/restore-drill.txt'
          ./scripts/larex-instance-backup.sh restore "${RUNNER_TEMP}/larex-drill.tar.gz" \
            --compose-file scripts/testdata/compose.instance-backup-drill.yaml \
            --auth-mode bundled \
            --yes

      - name: Assert restored state
        run: |
          test "$(
            docker compose -f scripts/testdata/compose.instance-backup-drill.yaml \
              exec -T postgres psql -qAt -U larex_drill -d larex_drill \
              -c "SELECT value FROM restore_drill"
          )" = "before"
          test "$(
            docker compose -f scripts/testdata/compose.instance-backup-drill.yaml \
              exec -T app sh -ec 'cat /mnt/data/restore-drill.txt'
          )" = "before"
          test "$(
            docker compose -f scripts/testdata/compose.instance-backup-drill.yaml \
              exec -T keycloak-postgres psql -qAt -U keycloak_drill -d keycloak_drill \
              -c "SELECT value FROM restore_drill"
          )" = "before"
          test "$(
            docker compose -f scripts/testdata/compose.instance-backup-drill.yaml \
              exec -T keycloak sh -ec 'cat /opt/keycloak/data/restore-drill.txt'
          )" = "before"

      - name: Show logs on failure
        if: failure()
        run: docker compose -f scripts/testdata/compose.instance-backup-drill.yaml logs

      - name: Stop drill services
        if: always()
        run: docker compose -f scripts/testdata/compose.instance-backup-drill.yaml down -v

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          tags: larex/backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          tags: larex/frontend:test
          build-args: |
            NODE_MAX_OLD_SPACE_SIZE=${{ env.NODE_MAX_OLD_SPACE_SIZE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
