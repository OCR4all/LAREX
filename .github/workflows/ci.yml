name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_MAX_OLD_SPACE_SIZE: 6144
  NODE_VERSION: 22

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          retry-on-snapshot-warnings: true

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: larex_user
          POSTGRES_PASSWORD: larex_password
          POSTGRES_DB: larex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Run tests
        working-directory: backend
        run: ./gradlew test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/larex_test
          SPRING_DATASOURCE_USERNAME: larex_user
          SPRING_DATASOURCE_PASSWORD: larex_password

      - name: Build JAR
        working-directory: backend
        run: ./gradlew build -x test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: backend/build/reports/tests/

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Run linting
        working-directory: frontend
        run: pnpm lint

      - name: Run type checking
        working-directory: frontend
        run: pnpm typecheck

      - name: Run tests
        working-directory: frontend
        run: pnpm test

      - name: Build
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=${{ env.NODE_MAX_OLD_SPACE_SIZE }}
        run: pnpm build

  keycloak-theme:
    name: Keycloak Theme Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: keycloak-theme/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: keycloak-theme
        run: pnpm install --frozen-lockfile

      - name: Build theme
        working-directory: keycloak-theme
        run: pnpm run build-keycloak-theme

      - name: Upload theme artifact
        uses: actions/upload-artifact@v7
        with:
          name: keycloak-theme
          path: keycloak-theme/dist_keycloak/

  docs:
    name: Docs Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: docs
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build

  compose-validation:
    name: Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate local dev compose
        run: docker compose -f compose.yaml config >/dev/null

      - name: Validate local dev compose with official Actions
        run: |
          docker compose --env-file deployment/env/.env.actions.example \
            -f compose.yaml \
            -f compose.actions.yaml \
            --profile actions \
            config >/dev/null

      - name: Validate local production-like compose
        run: |
          docker compose --env-file deployment/env/.env.prod.local.example \
            -f compose.prod.base.yaml \
            -f compose.prod.auth.bundled-keycloak.yaml \
            -f compose.prod.local.yaml \
            config >/dev/null

      - name: Validate local production-like compose with official Actions
        run: |
          docker compose \
            --env-file deployment/env/.env.prod.local.example \
            --env-file deployment/env/.env.actions.example \
            -f compose.prod.base.yaml \
            -f compose.prod.auth.bundled-keycloak.yaml \
            -f compose.prod.local.yaml \
            -f compose.actions.yaml \
            --profile actions \
            config >/dev/null

      - name: Validate production compose with bundled Keycloak
        run: |
          docker compose --env-file deployment/env/.env.prod.example \
            -f compose.prod.base.yaml \
            -f compose.prod.auth.bundled-keycloak.yaml \
            -f compose.prod.publish.localhost.yaml \
            config >/dev/null

      - name: Validate production compose with official Actions
        run: |
          docker compose \
            --env-file deployment/env/.env.prod.example \
            --env-file deployment/env/.env.actions.example \
            -f compose.prod.base.yaml \
            -f compose.prod.auth.bundled-keycloak.yaml \
            -f compose.prod.publish.localhost.yaml \
            -f compose.actions.yaml \
            --profile actions \
            config >/dev/null

      - name: Validate production compose with external Keycloak
        run: |
          docker compose --env-file deployment/env/.env.prod.example \
            -f compose.prod.base.yaml \
            -f compose.prod.auth.external-keycloak.yaml \
            -f compose.prod.publish.localhost.yaml \
            config >/dev/null

      - name: Validate production compose with bundled Nginx
        run: |
          docker compose --env-file deployment/env/.env.prod.example \
            -f compose.prod.base.yaml \
            -f compose.prod.auth.bundled-keycloak.yaml \
            -f compose.prod.publish.localhost.yaml \
            -f compose.prod.nginx.yaml \
            config >/dev/null

      - name: Validate production compose with external Keycloak and bundled Nginx
        env:
          NGINX_TEMPLATE_FILE: ./deployment/nginx/templates/larex-proxy.external-keycloak.conf.template
        run: |
          docker compose --env-file deployment/env/.env.prod.example \
            -f compose.prod.base.yaml \
            -f compose.prod.auth.external-keycloak.yaml \
            -f compose.prod.publish.localhost.yaml \
            -f compose.prod.nginx.yaml \
            config >/dev/null

      - name: Validate production compose with self-hosted docs
        run: |
          docker compose --env-file deployment/env/.env.prod.example \
            -f compose.prod.base.yaml \
            -f compose.prod.auth.bundled-keycloak.yaml \
            -f compose.prod.publish.localhost.yaml \
            -f compose.prod.docs.yaml \
            config >/dev/null

      - name: Verify core production service hardening
        run: |
          docker compose --env-file deployment/env/.env.prod.example \
            -f compose.prod.base.yaml \
            -f compose.prod.auth.bundled-keycloak.yaml \
            -f compose.prod.publish.localhost.yaml \
            config --format json \
            | jq -e '
                .services.app.read_only == true
                and (.services.app.cap_drop | index("ALL"))
                and (.services.app.security_opt | index("no-new-privileges:true"))
                and .services.frontend.read_only == true
                and (.services.frontend.cap_drop | index("ALL"))
                and (.services.frontend.security_opt | index("no-new-privileges:true"))
              ' >/dev/null

          docker compose --env-file deployment/env/.env.prod.example \
            -f compose.prod.base.yaml \
            -f compose.prod.auth.bundled-keycloak.yaml \
            -f compose.prod.publish.localhost.yaml \
            -f compose.prod.docs.yaml \
            config --format json \
            | jq -e '
                .services.docs.read_only == true
                and (.services.docs.cap_drop | index("ALL"))
                and (.services.docs.security_opt | index("no-new-privileges:true"))
                and .services.docs.environment.NITRO_CONTENT_DATABASE_FILENAME == "/tmp/contents.sqlite"
              ' >/dev/null

      - name: Build supported deployment package
        run: bash ./scripts/test-release-artifacts.sh "$RUNNER_TEMP"

      - name: Check for removed deployment references
        run: |
          if grep -R -n -E 'compose\.prod\.traefik\.yaml|compose\.prod\.external-keycloak\.yaml|\.env\.prod\.traefik\.example|\.env\.prod\.external-keycloak\.example|API_HOSTNAME|compose\.prod\.local\.nginx\.yaml|compose\.prod\.kraken\.yaml|compose\.kraken\.yaml|kraken-local-test\.sh' README.md docs Taskfile.yml; then
            echo "Found stale deployment references"
            exit 1
          fi

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          tags: larex/backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          tags: larex/frontend:test
          build-args: |
            NODE_MAX_OLD_SPACE_SIZE=${{ env.NODE_MAX_OLD_SPACE_SIZE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build docs image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docs/Dockerfile.prod
          push: false
          tags: larex/docs:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
