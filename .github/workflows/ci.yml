name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: larex_user
          POSTGRES_PASSWORD: larex_password
          POSTGRES_DB: larex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Run tests
        working-directory: backend
        run: ./gradlew test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/larex_test
          SPRING_DATASOURCE_USERNAME: larex_user
          SPRING_DATASOURCE_PASSWORD: larex_password

      - name: Build JAR
        working-directory: backend
        run: ./gradlew build -x test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/build/reports/tests/

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      #- name: Run linting
      #  working-directory: frontend
      #  run: pnpm lint

      #- name: Run type checking
      #  working-directory: frontend
      #  run: pnpm typecheck

      - name: Build
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build

  keycloak-theme:
    name: Keycloak Theme Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: keycloak-theme/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: keycloak-theme
        run: pnpm install --frozen-lockfile

      - name: Build theme
        working-directory: keycloak-theme
        run: pnpm run build-keycloak-theme

      - name: Upload theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-theme
          path: keycloak-theme/build_keycloak/

  compose-validation:
    name: Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate local dev compose
        run: docker compose -f compose.yaml config >/dev/null

      - name: Validate local production-like compose
        run: |
          docker compose --env-file deployment/env/.env.prod.local.example \
            -f compose.prod.base.yaml \
            -f compose.prod.auth.bundled-keycloak.yaml \
            -f compose.prod.local.yaml \
            config >/dev/null

      - name: Validate production compose with bundled Keycloak
        run: |
          docker compose --env-file deployment/env/.env.prod.example \
            -f compose.prod.base.yaml \
            -f compose.prod.auth.bundled-keycloak.yaml \
            -f compose.prod.publish.localhost.yaml \
            config >/dev/null

      - name: Validate production compose with external Keycloak
        run: |
          docker compose --env-file deployment/env/.env.prod.example \
            -f compose.prod.base.yaml \
            -f compose.prod.auth.external-keycloak.yaml \
            -f compose.prod.publish.localhost.yaml \
            config >/dev/null

      - name: Validate production compose with bundled Nginx
        run: |
          docker compose --env-file deployment/env/.env.prod.example \
            -f compose.prod.base.yaml \
            -f compose.prod.auth.bundled-keycloak.yaml \
            -f compose.prod.publish.localhost.yaml \
            -f compose.prod.nginx.yaml \
            config >/dev/null

      - name: Check for removed deployment references
        run: |
          if grep -R -n -E 'compose\.prod\.traefik\.yaml|compose\.prod\.external-keycloak\.yaml|\.env\.prod\.traefik\.example|\.env\.prod\.external-keycloak\.example|API_HOSTNAME|compose\.prod\.local\.nginx\.yaml' README.md docs Taskfile.yml; then
            echo "Found stale deployment references"
            exit 1
          fi

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: larex/backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: larex/frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
