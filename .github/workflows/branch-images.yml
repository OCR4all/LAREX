name: Branch Container Images

on:
  push:
    branches: [dev, staging, next]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ocr4all/larex/backend
  IMAGE_NAME_FRONTEND: ocr4all/larex/frontend

jobs:
  test:
    name: Run CI
    if: ${{ github.ref_name == 'dev' || github.ref_name == 'staging' || github.ref_name == 'next' }}
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build and Push Branch Images
    needs: test
    if: ${{ github.ref_name == 'dev' || github.ref_name == 'staging' || github.ref_name == 'next' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          flavor: |
            latest=false
          tags: |
            type=raw,value={{branch}}
            type=raw,value={{branch}}-{{sha}}
            type=sha,prefix=sha-

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          flavor: |
            latest=false
          tags: |
            type=raw,value={{branch}}
            type=raw,value={{branch}}-{{sha}}
            type=sha,prefix=sha-

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
