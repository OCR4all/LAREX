version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/backend"
    target-branch: "dev"
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "direct"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns:
          - "org.springframework*"
      testing:
        patterns:
          - "org.junit*"
          - "org.testcontainers*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "dev"
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "direct"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      nuxt:
        patterns:
          - "@nuxt/*"
          - "nuxt*"
      vue:
        patterns:
          - "vue*"
          - "@vue/*"
      dev-dependencies:
        dependency-type: "development"
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/docs"
    target-branch: "dev"
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "direct"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      nuxt:
        patterns:
          - "@nuxt/*"
          - "nuxt*"
      dev-dependencies:
        dependency-type: "development"
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/keycloak-theme"
    target-branch: "dev"
    cooldown:
      default-days: 10
    allow:
      - dependency-type: "direct"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/backend"
    target-branch: "dev"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directory: "/frontend"
    target-branch: "dev"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directory: "/docs"
    target-branch: "dev"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
