services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    restart: unless-stopped
    command: start --import-realm
    ports:
      - "${LAREX_BIND_IP:-127.0.0.1}:8090:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/larexdb
      KC_DB_USERNAME: ${POSTGRES_USER:-larex_prod}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
      KC_HOSTNAME: https://${KEYCLOAK_PUBLIC_HOST:-auth.example.org}
      KC_HOSTNAME_STRICT: ${KEYCLOAK_HOSTNAME_STRICT:-true}
      KC_HOSTNAME_STRICT_HTTPS: ${KEYCLOAK_HOSTNAME_STRICT_HTTPS:-true}
      KC_HTTP_ENABLED: ${KEYCLOAK_HTTP_ENABLED:-true}
      KC_PROXY_HEADERS: ${KEYCLOAK_PROXY_HEADERS:-xforwarded}
      KC_PROXY: edge
      KC_HEALTH_ENABLED: true
      KEYCLOAK_FRONTEND_URL: https://${KEYCLOAK_PUBLIC_HOST:-auth.example.org}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_REALM:-larex-prod}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-change-me}
      NUXT_OAUTH_KEYCLOAK_CLIENT_SECRET: ${NUXT_OAUTH_KEYCLOAK_CLIENT_SECRET:-change-me}
      NUXT_OAUTH_KEYCLOAK_REDIRECT_URL: ${NUXT_OAUTH_KEYCLOAK_REDIRECT_URL:-https://${LAREX_PUBLIC_HOST:-app.example.org}/auth/keycloak}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-https://${LAREX_PUBLIC_HOST:-app.example.org}}
      LAREX_INITIAL_ADMIN_USERNAME: ${LAREX_INITIAL_ADMIN_USERNAME:-admin}
      LAREX_INITIAL_ADMIN_EMAIL: ${LAREX_INITIAL_ADMIN_EMAIL:-admin@example.org}
      LAREX_INITIAL_ADMIN_FIRST_NAME: ${LAREX_INITIAL_ADMIN_FIRST_NAME:-LAREX}
      LAREX_INITIAL_ADMIN_LAST_NAME: ${LAREX_INITIAL_ADMIN_LAST_NAME:-Administrator}
      LAREX_INITIAL_ADMIN_TEMP_PASSWORD: ${LAREX_INITIAL_ADMIN_TEMP_PASSWORD:-change-me-initial-admin}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./config/keycloak/larex.bootstrap.realm.json:/opt/keycloak/data/import/larex.bootstrap.realm.json:ro
      - ./config/keycloak/theme.jar:/opt/keycloak/providers/larex_theme.jar:ro
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    environment:
      KEYCLOAK_ADMIN_SERVER_URL: ${KEYCLOAK_ADMIN_SERVER_URL:-http://keycloak:8080}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_REALM:-larex-prod}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:-http://keycloak:8080/realms/${KEYCLOAK_REALM:-larex-prod}/protocol/openid-connect/certs}
    depends_on:
      keycloak:
        condition: service_healthy

  frontend:
    environment:
      NUXT_OAUTH_KEYCLOAK_SERVER_URL_INTERNAL: ${NUXT_OAUTH_KEYCLOAK_SERVER_URL_INTERNAL:-http://keycloak:8080}
    depends_on:
      keycloak:
        condition: service_healthy

networks:
  backend:
    driver: bridge

volumes:
  keycloak_data:
