emailVerificationBodyHtml=<p>Jemand hat ein {2}-Konto mit dieser E-Mail-Adresse erstellt. Wenn Sie das waren, bestätigen Sie bitte jetzt Ihre Adresse.</p><p><a href="{0}" style="background-color:#3d8dfc;border-radius:999px;color:#ffffff;display:inline-block;font-size:15px;font-weight:700;line-height:22px;padding:11px 18px;text-decoration:none;">E-Mail-Adresse bestätigen</a></p><p style="color:#888888;font-size:13px;line-height:1.55;">Dieser sichere Link ist {3} gültig. Falls die Schaltfläche nicht geöffnet wird, verwenden Sie stattdessen diesen Link:<br /><a href="{0}" style="color:#5e5e5e;font-size:13px;line-height:1.55;text-decoration:underline;word-break:break-all;">{0}</a></p><p>Falls Sie dieses Konto nicht erstellt haben, können Sie diese E-Mail ignorieren.</p>
