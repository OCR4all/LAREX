services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    environment:
      CONTAINERS: 1
      EVENTS: 1
      SERVICES: 1
      SWARM: 0
      NETWORKS: 1
      TASKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro,Z
    networks:
      - socket-proxy
    restart: unless-stopped

  traefik:
    image: traefik:v3.7.5
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "8081:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro,Z
    networks:
      - default
      - socket-proxy
    depends_on:
      - socket-proxy

  postgres:
    image: postgres:18.2-alpine
    environment:
      POSTGRES_DB: larex_backend
      POSTGRES_USER: larex
      POSTGRES_PASSWORD: larex_dev_pw
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U larex -d larex_backend"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak-postgres:
    image: postgres:18.2-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_dev_pw
      PGDATA: /var/lib/postgresql/data
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev_pw
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://keycloak.localhost
      KC_HOSTNAME_STRICT: true
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_FRONTEND_URL: http://keycloak.localhost
    volumes:
      - ./config/keycloak/dev.realm.json:/opt/keycloak/data/import/dev.realm.json:Z
      - ./config/keycloak/theme.jar:/opt/keycloak/providers/larex_theme.jar:Z
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`keycloak.localhost`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.29.1
    ports:
      - "8025:8025"  # Web UI
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`mail.localhost`)"
      - "traefik.http.routers.mailpit.entrypoints=web"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"

  app:
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "5005:5005"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      KEYCLOAK_ADMIN_CLIENT_SECRET: PLEASE_CHANGE_IN_PRODUCTION
      KEYCLOAK_ACTION_EMAIL_CLIENT_ID: ${KEYCLOAK_ACTION_EMAIL_CLIENT_ID:-larex-frontend}
      KEYCLOAK_ACTION_EMAIL_REDIRECT_URI: ${KEYCLOAK_ACTION_EMAIL_REDIRECT_URI:-http://larex.localhost/auth/keycloak}
      KEYCLOAK_ACTION_EMAIL_LIFESPAN_SECONDS: ${KEYCLOAK_ACTION_EMAIL_LIFESPAN_SECONDS:-43200}
      SPRING_DEVTOOLS_RESTART_ENABLED: true
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: true
      LAREX_ACTIONS_PUBLIC_BASE_URL: http://app:8080/api/v1
      LAREX_ACTION_ENDPOINT_SECRET_MOCK_PROCESSOR_V1: ${LAREX_ACTION_ENDPOINT_SECRET_MOCK_PROCESSOR_V1:-dev-mock-action-secret-change-me}
      LAREX_ACTION_ENDPOINT_SECRET_KRAKEN_SEGMENTATION_V1: ${LAREX_ACTION_ENDPOINT_SECRET_KRAKEN_SEGMENTATION_V1:-dev-kraken-segmentation-secret-change-me}
    volumes:
      - ./backend/src:/app/src:cached,Z
      - ./backend/build.gradle.kts:/app/build.gradle.kts:ro,Z
      - ./backend/settings.gradle.kts:/app/settings.gradle.kts:ro,Z
      - gradle_cache:/home/gradle/.gradle
      - ./backend/uploads:/uploads:Z
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
    depends_on:
      - postgres
      - keycloak
      - mailpit

  mock-action-processor:
    build:
      context: scripts/mock-processor
      dockerfile: Dockerfile
    environment:
      LAREX_DISPATCH_HMAC_SECRET: ${LAREX_ACTION_ENDPOINT_SECRET_MOCK_PROCESSOR_V1:-dev-mock-action-secret-change-me}
      LAREX_PROCESSOR_ID: mock-image-copy
      LAREX_OUTPUT_IMAGE_VARIANT: action-copy
      LAREX_HEARTBEAT_COUNT: 4
      LAREX_HEARTBEAT_DELAY_SECONDS: 1
    ports:
      - "9000:9000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mock-action-processor.rule=Host(`mock-action-processor.localhost`)"
      - "traefik.http.routers.mock-action-processor.entrypoints=web"
      - "traefik.http.services.mock-action-processor.loadbalancer.server.port=9000"

  kraken-segmentation-processor:
    build:
      context: scripts/kraken-processor
      dockerfile: Dockerfile
    environment:
      LAREX_DISPATCH_HMAC_SECRET: ${LAREX_ACTION_ENDPOINT_SECRET_KRAKEN_SEGMENTATION_V1:-dev-kraken-segmentation-secret-change-me}
      LAREX_PROCESSOR_ID: kraken-segmentation
      KRAKEN_DEVICE: ${KRAKEN_DEVICE:-cpu}
      KRAKEN_PRECISION: ${KRAKEN_PRECISION:-32-true}
      KRAKEN_TEXT_DIRECTION: ${KRAKEN_TEXT_DIRECTION:-horizontal-lr}
      KRAKEN_MAX_PROCESS_SECONDS: ${KRAKEN_MAX_PROCESS_SECONDS:-900}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kraken-segmentation-processor.rule=Host(`kraken-segmentation-processor.localhost`)"
      - "traefik.http.routers.kraken-segmentation-processor.entrypoints=web"
      - "traefik.http.services.kraken-segmentation-processor.loadbalancer.server.port=9000"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:Z
      - /app/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`larex.localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    extra_hosts:
      - "keycloak.localhost:host-gateway"

volumes:
  postgres_data:
  keycloak_postgres_data:
  gradle_cache:

networks:
  socket-proxy:
    driver: bridge
