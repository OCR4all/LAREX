services:
  app:
    environment:
      LAREX_ACTIONS_PUBLIC_BASE_URL: ${LAREX_ACTIONS_PUBLIC_BASE_URL:-http://app:8080/api/v1}
      LAREX_ACTIONS_ENDPOINT_ALLOWED_ORIGINS: ${LAREX_ACTIONS_ENDPOINT_ALLOWED_ORIGINS:-http://kraken-segmentation-processor:9000}

  kraken-segmentation-processor:
    build:
      context: scripts/kraken-processor
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LAREX_ALLOWED_CALLBACK_ORIGINS: ${LAREX_ALLOWED_CALLBACK_ORIGINS:-http://app:8080}
      LAREX_DISPATCH_HMAC_SECRET: ${LAREX_ACTION_ENDPOINT_SECRET_KRAKEN_SEGMENTATION_V1:-change-me}
      LAREX_PROCESSOR_ID: kraken-segmentation
      KRAKEN_DEVICE: ${KRAKEN_DEVICE:-cpu}
      KRAKEN_PRECISION: ${KRAKEN_PRECISION:-32-true}
      KRAKEN_TEXT_DIRECTION: ${KRAKEN_TEXT_DIRECTION:-horizontal-lr}
      KRAKEN_SEGMENTATION_MODEL: ${KRAKEN_SEGMENTATION_MODEL:-}
      KRAKEN_MAX_PROCESS_SECONDS: ${KRAKEN_MAX_PROCESS_SECONDS:-900}
    networks:
      - backend
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kraken-segmentation-processor.rule=Host(`kraken-segmentation-processor.localhost`)"
      - "traefik.http.routers.kraken-segmentation-processor.entrypoints=web"
      - "traefik.http.services.kraken-segmentation-processor.loadbalancer.server.port=9000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge
