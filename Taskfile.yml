# https://taskfile.dev

version: '3'

vars:
  VERSION:
    sh: cat VERSION
  DOCKER_REGISTRY: ghcr.io/ocr4all/larex
  COMPOSE_FILE: compose.yaml
  COMPOSE_DEV_DOCS_FILE: compose.dev.docs.yaml
  COMPOSE_ACTIONS_FILE: compose.actions.yaml
  ACTIONS_ENV_FILE: .env.actions
  COMPOSE_PROD_BASE_FILE: compose.prod.base.yaml
  COMPOSE_PROD_AUTH_BUNDLED_FILE: compose.prod.auth.bundled-keycloak.yaml
  COMPOSE_PROD_AUTH_EXTERNAL_FILE: compose.prod.auth.external-keycloak.yaml
  COMPOSE_PROD_PUBLISH_FILE: compose.prod.publish.localhost.yaml
  COMPOSE_PROD_LOCAL_FILE: compose.prod.local.yaml
  COMPOSE_PROD_LOCAL_DOCS_FILE: compose.prod.local.docs.yaml
  COMPOSE_PROD_DOCS_FILE: compose.prod.docs.yaml
  COMPOSE_PROD_NGINX_FILE: compose.prod.nginx.yaml
  COMPOSE_DEV_CMD: docker compose -f {{.COMPOSE_FILE}}
  COMPOSE_DEV_ACTIONS_CMD: >-
    docker compose --env-file {{.ACTIONS_ENV_FILE}}
    -f {{.COMPOSE_FILE}} -f {{.COMPOSE_ACTIONS_FILE}} --profile actions
  COMPOSE_PROD_CMD: >-
    docker compose --env-file .env.prod
    -f {{.COMPOSE_PROD_BASE_FILE}}
    -f {{.COMPOSE_PROD_AUTH_BUNDLED_FILE}}
    -f {{.COMPOSE_PROD_PUBLISH_FILE}}
  COMPOSE_PROD_DOCS_CMD: '{{.COMPOSE_PROD_CMD}} -f {{.COMPOSE_PROD_DOCS_FILE}}'
  COMPOSE_PROD_ACTIONS_CMD: >-
    docker compose --env-file .env.prod --env-file {{.ACTIONS_ENV_FILE}}
    -f {{.COMPOSE_PROD_BASE_FILE}}
    -f {{.COMPOSE_PROD_AUTH_BUNDLED_FILE}}
    -f {{.COMPOSE_PROD_PUBLISH_FILE}}
    -f {{.COMPOSE_ACTIONS_FILE}} --profile actions
  COMPOSE_PROD_LOCAL_CMD: >-
    docker compose --env-file .env.prod.local
    -f {{.COMPOSE_PROD_BASE_FILE}}
    -f {{.COMPOSE_PROD_AUTH_BUNDLED_FILE}}
    -f {{.COMPOSE_PROD_LOCAL_FILE}}
  COMPOSE_PROD_LOCAL_DOCS_CMD: '{{.COMPOSE_PROD_LOCAL_CMD}} -f {{.COMPOSE_PROD_LOCAL_DOCS_FILE}}'
  COMPOSE_PROD_LOCAL_ACTIONS_CMD: >-
    docker compose --env-file .env.prod.local --env-file {{.ACTIONS_ENV_FILE}}
    -f {{.COMPOSE_PROD_BASE_FILE}}
    -f {{.COMPOSE_PROD_AUTH_BUNDLED_FILE}}
    -f {{.COMPOSE_PROD_LOCAL_FILE}}
    -f {{.COMPOSE_ACTIONS_FILE}} --profile actions
  COMPOSE_PROD_EXTERNAL_KEYCLOAK_CMD: >-
    docker compose --env-file .env.prod
    -f {{.COMPOSE_PROD_BASE_FILE}}
    -f {{.COMPOSE_PROD_AUTH_EXTERNAL_FILE}}
    -f {{.COMPOSE_PROD_PUBLISH_FILE}}
  COMPOSE_PROD_NGINX_CMD: '{{.COMPOSE_PROD_CMD}} -f {{.COMPOSE_PROD_NGINX_FILE}}'

includes:
  backend:
    taskfile: ./backend/Taskfile.yml
    dir: ./backend
  docs:
    taskfile: ./docs/Taskfile.yml
    dir: ./docs
  frontend:
    taskfile: ./frontend/Taskfile.yml
    dir: ./frontend
  theme:
    taskfile: ./keycloak-theme/Taskfile.yml
    dir: ./keycloak-theme

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  # ============================================================================
  # Development Setup
  # ============================================================================

  setup:
    desc: One-time setup for new developers
    cmds:
      - task: install
      - task: docker:infra
      - echo "Setup complete! Run 'task dev' to start development."

  install:
    desc: Install all dependencies
    cmds:
      - task: docs:install
      - task: frontend:install
      - task: theme:install
      - echo "All dependencies installed."

  dev:
    desc: Start development environment (requires infrastructure running)
    deps:
      - docker:infra
    cmds:
      - 'echo "Infrastructure is running. Start backend and frontend manually:"'
      - 'echo "  Terminal 1: task backend:dev"'
      - 'echo "  Terminal 2: task frontend:dev"'
      - 'echo ""'
      - 'echo "Or use Docker for everything: task docker:up"'

  # ============================================================================
  # Docker Orchestration
  # ============================================================================

  docker:up:
    desc: Start all services with Docker Compose
    cmds:
      - '{{.COMPOSE_DEV_CMD}} up -d'

  docker:up:build:
    desc: Build and start all services with Docker Compose
    cmds:
      - '{{.COMPOSE_DEV_CMD}} up -d --build'

  docker:up:docs:
    desc: Start local dev stack with self-hosted docs
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} -f {{.COMPOSE_DEV_DOCS_FILE}} up -d

  docker:actions:init-env:
    desc: Create .env.actions and seed official Action processor secrets
    cmds:
      - ./scripts/bootstrap-env-secrets.sh actions

  docker:actions:up:
    desc: Start local dev stack with all official Action processors
    deps:
      - docker:actions:init-env
    cmds:
      - '{{.COMPOSE_DEV_ACTIONS_CMD}} up -d --build'

  docker:actions:down:
    desc: Stop local dev stack with official Action processors
    cmds:
      - '{{.COMPOSE_DEV_ACTIONS_CMD}} down'

  docker:actions:logs:
    desc: Follow local dev and official Action processor logs
    cmds:
      - '{{.COMPOSE_DEV_ACTIONS_CMD}} logs -f'

  docker:actions:ps:
    desc: Show local dev and official Action processor status
    cmds:
      - '{{.COMPOSE_DEV_ACTIONS_CMD}} ps'

  docker:down:
    desc: Stop all services
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down

  docker:down:docs:
    desc: Stop local dev stack with docs override
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} -f {{.COMPOSE_DEV_DOCS_FILE}} down

  docker:down:clean:
    desc: Stop all services and remove volumes
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down -v

  docker:infra:
    desc: Start only infrastructure services (postgres, keycloak, traefik)
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d postgres keycloak traefik

  docker:logs:
    desc: View logs from all services
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f

  docker:logs:backend:
    desc: View backend logs
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f app

  docker:logs:frontend:
    desc: View frontend logs
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f frontend

  docker:logs:docs:
    desc: View docs logs in local dev stack
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} -f {{.COMPOSE_DEV_DOCS_FILE}} logs -f docs

  docker:ps:
    desc: Show running containers
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} ps

  # ============================================================================
  # Production Docker
  # ============================================================================

  docker:prod:up:
    desc: "Start opinionated production services (bundled Keycloak, external reverse proxy friendly)"
    deps:
      - docker:prod:init-env
    cmds:
      - '{{.COMPOSE_PROD_CMD}} up -d --wait --wait-timeout "${LAREX_COMPOSE_WAIT_TIMEOUT:-300}"'

  docker:prod:init-env:
    desc: Create .env.prod from template and seed required secrets
    cmds:
      - ./scripts/bootstrap-env-secrets.sh prod

  docker:prod:up:docs:
    desc: Start opinionated production services with self-hosted docs
    deps:
      - docker:prod:init-env
    cmds:
      - '{{.COMPOSE_PROD_DOCS_CMD}} up -d --wait --wait-timeout "${LAREX_COMPOSE_WAIT_TIMEOUT:-300}"'

  docker:prod:actions:up:
    desc: Start opinionated production with all official Action processors
    deps:
      - docker:prod:init-env
      - docker:actions:init-env
    cmds:
      - '{{.COMPOSE_PROD_ACTIONS_CMD}} up -d --wait --wait-timeout "${LAREX_COMPOSE_WAIT_TIMEOUT:-300}"'

  docker:prod:actions:down:
    desc: Stop opinionated production with official Action processors
    cmds:
      - '{{.COMPOSE_PROD_ACTIONS_CMD}} down'

  docker:prod:actions:logs:
    desc: Follow opinionated production and official Action processor logs
    cmds:
      - '{{.COMPOSE_PROD_ACTIONS_CMD}} logs -f'

  docker:prod:actions:ps:
    desc: Show opinionated production and official Action processor status
    cmds:
      - '{{.COMPOSE_PROD_ACTIONS_CMD}} ps'

  docker:prod:actions:pull:
    desc: Pull pinned production and official Action processor images
    deps:
      - docker:prod:init-env
      - docker:actions:init-env
    cmds:
      - '{{.COMPOSE_PROD_ACTIONS_CMD}} pull'

  docker:prod:actions:upgrade:
    desc: Pull and apply a production upgrade with official Action processors
    cmds:
      - task: docker:prod:actions:pull
      - task: docker:prod:actions:up

  docker:prod:config:
    desc: Validate the opinionated production Compose model
    deps:
      - docker:prod:init-env
    cmds:
      - '{{.COMPOSE_PROD_CMD}} config --quiet'

  docker:prod:ps:
    desc: Show opinionated production service status
    cmds:
      - '{{.COMPOSE_PROD_CMD}} ps'

  docker:prod:pull:
    desc: Pull pinned opinionated production images
    deps:
      - docker:prod:init-env
    cmds:
      - '{{.COMPOSE_PROD_CMD}} pull'

  docker:prod:upgrade:
    desc: Pull and apply an opinionated production upgrade
    cmds:
      - task: docker:prod:pull
      - task: docker:prod:up

  docker:prod:down:
    desc: Stop opinionated production services
    cmds:
      - '{{.COMPOSE_PROD_CMD}} down'

  docker:prod:down:docs:
    desc: Stop opinionated production services with docs override
    cmds:
      - '{{.COMPOSE_PROD_DOCS_CMD}} down'

  docker:prod:logs:
    desc: View logs for opinionated production services
    cmds:
      - '{{.COMPOSE_PROD_CMD}} logs -f'

  docker:prod:logs:docs:
    desc: View logs for opinionated production services with docs
    cmds:
      - '{{.COMPOSE_PROD_DOCS_CMD}} logs -f docs'

  docker:prod:local:up:
    desc: Start production-like local stack (Traefik + local hostnames + Mailpit)
    deps:
      - docker:prod:local:init-env
    cmds:
      - '{{.COMPOSE_PROD_LOCAL_CMD}} up -d --wait --wait-timeout "${LAREX_COMPOSE_WAIT_TIMEOUT:-300}"'

  docker:prod:local:init-env:
    desc: Create .env.prod.local from template and seed required secrets
    cmds:
      - ./scripts/bootstrap-env-secrets.sh prod-local

  docker:prod:local:up:docs:
    desc: Start production-like local stack with self-hosted docs
    deps:
      - docker:prod:local:init-env
    cmds:
      - '{{.COMPOSE_PROD_LOCAL_DOCS_CMD}} up -d --wait --wait-timeout "${LAREX_COMPOSE_WAIT_TIMEOUT:-300}"'

  docker:prod:local:actions:up:
    desc: Start local production-like stack with all official Action processors
    deps:
      - docker:prod:local:init-env
      - docker:actions:init-env
    cmds:
      - '{{.COMPOSE_PROD_LOCAL_ACTIONS_CMD}} up -d --wait --wait-timeout "${LAREX_COMPOSE_WAIT_TIMEOUT:-300}"'

  docker:prod:local:actions:down:
    desc: Stop local production-like stack with official Action processors
    cmds:
      - '{{.COMPOSE_PROD_LOCAL_ACTIONS_CMD}} down'

  docker:prod:local:actions:logs:
    desc: Follow local production-like and official Action processor logs
    cmds:
      - '{{.COMPOSE_PROD_LOCAL_ACTIONS_CMD}} logs -f'

  docker:prod:local:config:
    desc: Validate the local production-like Compose model
    deps:
      - docker:prod:local:init-env
    cmds:
      - '{{.COMPOSE_PROD_LOCAL_CMD}} config --quiet'

  docker:prod:local:ps:
    desc: Show local production-like service status
    cmds:
      - '{{.COMPOSE_PROD_LOCAL_CMD}} ps'

  docker:prod:local:down:
    desc: Stop production-like local stack
    cmds:
      - '{{.COMPOSE_PROD_LOCAL_CMD}} down'

  docker:prod:local:down:docs:
    desc: Stop production-like local stack with docs override
    cmds:
      - '{{.COMPOSE_PROD_LOCAL_DOCS_CMD}} down'

  docker:prod:local:logs:
    desc: View logs for production-like local stack
    cmds:
      - '{{.COMPOSE_PROD_LOCAL_CMD}} logs -f'

  docker:prod:local:logs:docs:
    desc: View logs for production-like local stack with docs
    cmds:
      - '{{.COMPOSE_PROD_LOCAL_DOCS_CMD}} logs -f docs'

  docker:prod:external-keycloak:up:
    desc: Start opinionated production services with external Keycloak
    deps:
      - docker:prod:init-env
    cmds:
      - '{{.COMPOSE_PROD_EXTERNAL_KEYCLOAK_CMD}} up -d --wait --wait-timeout "${LAREX_COMPOSE_WAIT_TIMEOUT:-300}"'

  docker:prod:external-keycloak:down:
    desc: Stop opinionated production services with external Keycloak
    cmds:
      - '{{.COMPOSE_PROD_EXTERNAL_KEYCLOAK_CMD}} down'

  docker:prod:external-keycloak:logs:
    desc: View logs for the external Keycloak production variant
    cmds:
      - '{{.COMPOSE_PROD_EXTERNAL_KEYCLOAK_CMD}} logs -f'

  docker:prod:nginx:up:
    desc: Start opinionated production services with bundled Nginx
    deps:
      - docker:prod:init-env
    cmds:
      - '{{.COMPOSE_PROD_NGINX_CMD}} up -d --wait --wait-timeout "${LAREX_COMPOSE_WAIT_TIMEOUT:-300}"'

  docker:prod:nginx:down:
    desc: Stop opinionated production services with bundled Nginx
    cmds:
      - '{{.COMPOSE_PROD_NGINX_CMD}} down'

  docker:prod:nginx:logs:
    desc: View logs for the bundled Nginx production variant
    cmds:
      - '{{.COMPOSE_PROD_NGINX_CMD}} logs -f'

  # ============================================================================
  # Testing
  # ============================================================================

  test:
    desc: Run all checks (backend + frontend + docs)
    cmds:
      - task: test:backend
      - task: test:docs
      - task: test:frontend

  test:backend:
    desc: Run backend tests
    cmds:
      - task: backend:test

  test:docs:
    desc: Verify docs build
    cmds:
      - task: docs:test

  test:frontend:
    desc: Run frontend lint and typecheck
    cmds:
      - task: frontend:lint
      - task: frontend:typecheck

  # ============================================================================
  # Building
  # ============================================================================

  build:
    desc: Build all projects
    cmds:
      - task: backend:build
      - task: docs:build
      - task: frontend:build
      - task: theme:build

  build:docker:
    desc: Build production Docker images
    cmds:
      - 'docker build -f backend/Dockerfile.prod -t {{.DOCKER_REGISTRY}}/backend:{{.VERSION}} -t {{.DOCKER_REGISTRY}}/backend:latest ./backend'
      - 'docker build -f frontend/Dockerfile.prod -t {{.DOCKER_REGISTRY}}/frontend:{{.VERSION}} -t {{.DOCKER_REGISTRY}}/frontend:latest ./frontend'

  # ============================================================================
  # Versioning
  # ============================================================================

  ver:
    desc: Show current version
    cmds:
      - echo "Current version {{.VERSION}}"

  ver:sync:
    desc: Sync VERSION file to all projects
    cmds:
      - ./scripts/version-sync.sh

  ver:bump:major:
    desc: Bump major version (X.0.0)
    cmds:
      - |
        IFS='.' read -r major minor patch < VERSION
        echo "$((major + 1)).0.0" > VERSION
      - task: ver:sync
      - task: ver

  ver:bump:minor:
    desc: Bump minor version (0.X.0)
    cmds:
      - |
        IFS='.' read -r major minor patch < VERSION
        echo "${major}.$((minor + 1)).0" > VERSION
      - task: ver:sync
      - task: ver

  ver:bump:patch:
    desc: Bump patch version (0.0.X)
    cmds:
      - |
        IFS='.' read -r major minor patch < VERSION
        echo "${major}.${minor}.$((patch + 1))" > VERSION
      - task: ver:sync
      - task: ver

  # ============================================================================
  # Release
  # ============================================================================

  release:docker:
    desc: Build and tag Docker images for release
    cmds:
      - 'echo "Building release images for version {{.VERSION}}..."'
      - 'docker build -f backend/Dockerfile.prod -t {{.DOCKER_REGISTRY}}/backend:{{.VERSION}} -t {{.DOCKER_REGISTRY}}/backend:latest ./backend'
      - 'docker build -f frontend/Dockerfile.prod -t {{.DOCKER_REGISTRY}}/frontend:{{.VERSION}} -t {{.DOCKER_REGISTRY}}/frontend:latest ./frontend'

  release:docker:push:
    desc: Push Docker images to registry
    cmds:
      - 'docker push {{.DOCKER_REGISTRY}}/backend:{{.VERSION}}'
      - 'docker push {{.DOCKER_REGISTRY}}/backend:latest'
      - 'docker push {{.DOCKER_REGISTRY}}/frontend:{{.VERSION}}'
      - 'docker push {{.DOCKER_REGISTRY}}/frontend:latest'

  # ============================================================================
  # Toolkit
  # ============================================================================

  data:dump:
    desc: Create a full file-based data dump via admin backup API
    cmds:
      - ./scripts/larex-backup.sh dump --output "${LAREX_BACKUP_OUTPUT_PATH:-/mnt/data/backups}"

  data:reseed:
    desc: Reseed file-based data from a dump archive via admin backup API
    cmds:
      - ./scripts/larex-backup.sh reseed --source "${LAREX_RESEED_SOURCE_PATH:?set LAREX_RESEED_SOURCE_PATH}" --output "${LAREX_RESEED_OUTPUT_PATH:-/mnt/data/backups}"

  clean:
    desc: Clean all build artifacts
    cmds:
      - task: backend:clean
      - task: docs:clean
      - task: frontend:clean
      - task: theme:clean
      - echo "All build artifacts cleaned."

  status:
    desc: Show status of all services
    cmds:
      - 'echo "=== Docker Services ==="'
      - docker compose -f {{.COMPOSE_FILE}} ps
      - 'echo ""'
      - 'echo "=== Version ==="'
      - 'echo "Current version {{.VERSION}}"'

  db:shell:
    desc: Open PostgreSQL shell
    cmds:
      - 'docker compose -f {{.COMPOSE_FILE}} exec postgres psql -U larex -d larex_backend'

  keycloak:shell:
    desc: Open Keycloak container shell
    cmds:
      - 'docker compose -f {{.COMPOSE_FILE}} exec keycloak bash'
