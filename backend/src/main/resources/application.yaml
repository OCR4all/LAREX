spring:
  application:
    name: backend
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true
  mvc:
    async:
      # Streaming exports can legitimately take longer than Spring MVC's 30-second default.
      request-timeout: ${LAREX_ASYNC_REQUEST_TIMEOUT:30m}
    servlet:
      path: /api/v1
  servlet:
    multipart:
      enabled: true
      location: ${larex.upload.temp-directory:${file.upload-dir}/temp}
      max-file-size: ${LAREX_ACTION_RESULT_MAX_FILE_BYTES:104857600}
      max-request-size: ${LAREX_ACTION_RESULT_MAX_TOTAL_BYTES:503316480}
  datasource:
    url: jdbc:postgresql://postgres:5432/larex_backend
    username: larex
    password: larex_dev_pw
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        type:
          json_format_mapper: de.uniwue.zpd.dachs.larex.backend.config.ToolsJacksonJsonFormatMapper
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak.localhost/realms/larex-dev
          jwk-set-uri: http://keycloak:8080/realms/larex-dev/protocol/openid-connect/certs
  # Email configuration
  mail:
    host: ${MAIL_HOST:mailpit}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@larex.localhost}
    enabled: ${MAIL_ENABLED:true}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          ssl:
            enable: ${MAIL_SMTP_SSL_ENABLE:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

keycloak:
  resource-client-id: larex-backend
  admin:
    server-url: http://keycloak:8080
    realm: larex-dev
    client-id: larex-backend-service
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:PLEASE_CHANGE_IN_PRODUCTION}
    action-email:
      client-id: ${KEYCLOAK_ACTION_EMAIL_CLIENT_ID:larex-frontend}
      redirect-uri: ${KEYCLOAK_ACTION_EMAIL_REDIRECT_URI:http://larex.localhost/auth/keycloak}
      lifespan-seconds: ${KEYCLOAK_ACTION_EMAIL_LIFESPAN_SECONDS:43200}

file:
  upload-dir: ${LAREX_UPLOAD_DIR:/uploads}

app:
  name: ${LAREX_INSTANCE_NAME:${APP_NAME:LAREX}}
  upload:
    profile-images:
      path: ${file.upload-dir}/profile-images
      base-url: /api/profile/images

# Storage quota configuration
larex:
  auth:
    user-provisioning-mode: ${LAREX_USER_PROVISIONING_MODE:LOCAL}
  storage:
    # Default storage quota per workspace in bytes (default: 1GB = 1073741824 bytes)
    default-quota-bytes: ${LAREX_DEFAULT_QUOTA_BYTES:1073741824}
    # Enable quota enforcement (default: true)
    quota-enforcement-enabled: ${LAREX_QUOTA_ENFORCEMENT_ENABLED:true}
    # Warning threshold percentage (default: 80%)
    quota-warning-threshold: ${LAREX_QUOTA_WARNING_THRESHOLD:80.0}
    quota-refresh:
      pool-size: ${LAREX_STORAGE_QUOTA_REFRESH_POOL_SIZE:1}
  async:
    default:
      core-pool-size: ${LAREX_ASYNC_DEFAULT_CORE_POOL:2}
      max-pool-size: ${LAREX_ASYNC_DEFAULT_MAX_POOL:4}
      queue-capacity: ${LAREX_ASYNC_DEFAULT_QUEUE:100}
  # XML versioning configuration
  versioning:
    # Maximum number of versions to keep per XML file (default: 25)
    max-versions-per-xml: ${LAREX_VERSIONING_MAX_VERSIONS:25}
  annotation:
    read-cache:
      maximum-size: ${LAREX_ANNOTATION_READ_CACHE_MAX_SIZE:250}
      expire-after-access-minutes: ${LAREX_ANNOTATION_READ_CACHE_EXPIRE_AFTER_ACCESS_MINUTES:10}
    post-save:
      core-pool-size: ${LAREX_ANNOTATION_POST_SAVE_CORE_POOL:1}
      max-pool-size: ${LAREX_ANNOTATION_POST_SAVE_MAX_POOL:2}
      queue-capacity: ${LAREX_ANNOTATION_POST_SAVE_QUEUE:200}
  notifications:
    bridge:
      enabled: ${LAREX_NOTIFICATIONS_BRIDGE_ENABLED:true}
      url: ${LAREX_NOTIFICATIONS_BRIDGE_URL:http://frontend:3000/api/notifications/broadcast}
      secret: ${LAREX_NOTIFICATIONS_BRIDGE_SECRET:larex-notification-bridge-dev-secret}
      max-skew-ms: ${LAREX_NOTIFICATIONS_BRIDGE_MAX_SKEW_MS:60000}
  # Chunked upload configuration
  upload:
    # Chunk size in bytes (default: 5MB = 5242880 bytes)
    chunk-size-bytes: ${LAREX_UPLOAD_CHUNK_SIZE:5242880}
    # Temp directory for upload chunks
    temp-directory: ${LAREX_UPLOAD_TEMP_DIR:${file.upload-dir}/temp}
    directories:
      root-directory: ${file.upload-dir}
      temp-directory: ${larex.upload.temp-directory}
      create-if-missing: ${LAREX_UPLOAD_CREATE_IF_MISSING:true}
      verify-writable: ${LAREX_UPLOAD_VERIFY_WRITABLE:true}
      fail-fast: ${LAREX_UPLOAD_STARTUP_FAIL_FAST:true}
    # Session timeout in hours (default: 24 hours)
    session-timeout-hours: ${LAREX_UPLOAD_SESSION_TIMEOUT:24}
    # Batch size for processing files (default: 10)
    batch-size: ${LAREX_UPLOAD_BATCH_SIZE:10}
    # Max concurrent sessions per user (default: 50)
    max-concurrent-sessions: ${LAREX_UPLOAD_MAX_SESSIONS:50}
    # Async executor configuration
    async:
      core-pool-size: ${LAREX_UPLOAD_ASYNC_CORE_POOL:2}
      max-pool-size: ${LAREX_UPLOAD_ASYNC_MAX_POOL:5}
      queue-capacity: ${LAREX_UPLOAD_ASYNC_QUEUE:100}
    index-async:
      core-pool-size: ${LAREX_UPLOAD_INDEX_ASYNC_CORE_POOL:1}
      max-pool-size: ${LAREX_UPLOAD_INDEX_ASYNC_MAX_POOL:2}
      queue-capacity: ${LAREX_UPLOAD_INDEX_ASYNC_QUEUE:200}
    indexing:
      stale-threshold-ms: ${LAREX_UPLOAD_INDEXING_STALE_THRESHOLD_MS:60000}
    # PDF rendering configuration. Oversized pages are rendered at a lower DPI
    # so that a single PDF page cannot allocate an unbounded raster in the heap.
    pdf:
      render-dpi: ${LAREX_UPLOAD_PDF_RENDER_DPI:250}
      max-rendered-pixels: ${LAREX_UPLOAD_PDF_MAX_RENDERED_PIXELS:16000000}
      preflight-sample-pages: ${LAREX_UPLOAD_PDF_PREFLIGHT_SAMPLE_PAGES:3}
      preflight-safety-factor: ${LAREX_UPLOAD_PDF_PREFLIGHT_SAFETY_FACTOR:1.25}
  # Server-side import configuration
  import:
    # Enable server-side import feature (default: true)
    enabled: ${LAREX_IMPORT_ENABLED:true}
    # Allowed paths for import (comma-separated)
    allowed-paths: ${LAREX_IMPORT_ALLOWED_PATHS:/data/imports,/mnt/shared/datasets}
    # Max directory scan depth (default: 10)
    max-scan-depth: ${LAREX_IMPORT_MAX_SCAN_DEPTH:10}
    # Max files per import job (default: 100000)
    max-files-per-job: ${LAREX_IMPORT_MAX_FILES:100000}
    async:
      core-pool-size: ${LAREX_IMPORT_ASYNC_CORE_POOL:1}
      max-pool-size: ${LAREX_IMPORT_ASYNC_MAX_POOL:2}
      queue-capacity: ${LAREX_IMPORT_ASYNC_QUEUE:10}
  project-packages:
    archive:
      # Extraction budgets protect package preview from oversized or highly compressed ZIPs.
      max-archive-bytes: ${LAREX_PROJECT_PACKAGE_MAX_ARCHIVE_BYTES:134217728}
      max-entries: ${LAREX_PROJECT_PACKAGE_MAX_ENTRIES:100000}
      max-entry-bytes: ${LAREX_PROJECT_PACKAGE_MAX_ENTRY_BYTES:536870912}
      max-total-bytes: ${LAREX_PROJECT_PACKAGE_MAX_TOTAL_BYTES:2147483648}
      max-descriptor-bytes: ${LAREX_PROJECT_PACKAGE_MAX_DESCRIPTOR_BYTES:16777216}
      max-compression-ratio: ${LAREX_PROJECT_PACKAGE_MAX_COMPRESSION_RATIO:200}
    preview:
      max-cached-bytes: ${LAREX_PROJECT_PACKAGE_PREVIEW_MAX_CACHED_BYTES:4294967296}
      max-sessions: ${LAREX_PROJECT_PACKAGE_PREVIEW_MAX_SESSIONS:64}
      expire-after-minutes: ${LAREX_PROJECT_PACKAGE_PREVIEW_EXPIRE_MINUTES:30}
  iiif:
    # Minimum delay between IIIF image download starts to the same host.
    # Set to 0 to rely only on adaptive Retry-After/backoff handling.
    download-min-interval-ms: ${LAREX_IIIF_DOWNLOAD_MIN_INTERVAL_MS:100}
    # Hard cap for one streamed IIIF image response (default: 512 MiB).
    max-image-download-bytes: ${LAREX_IIIF_MAX_IMAGE_DOWNLOAD_BYTES:536870912}
    preview-async:
      core-pool-size: ${LAREX_IIIF_PREVIEW_ASYNC_CORE_POOL:2}
      max-pool-size: ${LAREX_IIIF_PREVIEW_ASYNC_MAX_POOL:4}
      queue-capacity: ${LAREX_IIIF_PREVIEW_ASYNC_QUEUE:100}
    download-async:
      core-pool-size: ${LAREX_IIIF_DOWNLOAD_ASYNC_CORE_POOL:1}
      max-pool-size: ${LAREX_IIIF_DOWNLOAD_ASYNC_MAX_POOL:2}
      queue-capacity: ${LAREX_IIIF_DOWNLOAD_ASYNC_QUEUE:50}
    # Active jobs are reclaimed after a worker stops renewing its lease.
    worker-lease-duration-ms: ${LAREX_IIIF_WORKER_LEASE_DURATION_MS:120000}
    worker-heartbeat-interval-ms: ${LAREX_IIIF_WORKER_HEARTBEAT_INTERVAL_MS:30000}
    worker-recovery-interval-ms: ${LAREX_IIIF_WORKER_RECOVERY_INTERVAL_MS:5000}
  backup:
    # Enable admin dump/reseed feature (default: true)
    enabled: ${LAREX_BACKUP_ENABLED:true}
    # Allowed source paths for verify/reseed jobs (comma-separated)
    allowed-paths: ${LAREX_BACKUP_ALLOWED_PATHS:/uploads,/mnt/data,/mnt/data/backups}
    # Operator-configured output directory for dump files and reseed markers
    output-dir: ${LAREX_BACKUP_OUTPUT_DIR:/mnt/data/backups}
    # Maximum number of files allowed per backup/reseed job
    max-files-per-job: ${LAREX_BACKUP_MAX_FILES_PER_JOB:500000}
    # Extraction budgets protect verify/reseed jobs from oversized or highly compressed archives.
    max-archive-bytes: ${LAREX_BACKUP_MAX_ARCHIVE_BYTES:21474836480}
    max-archive-entries: ${LAREX_BACKUP_MAX_ARCHIVE_ENTRIES:500000}
    max-archive-entry-bytes: ${LAREX_BACKUP_MAX_ARCHIVE_ENTRY_BYTES:5368709120}
    max-archive-total-bytes: ${LAREX_BACKUP_MAX_ARCHIVE_TOTAL_BYTES:107374182400}
    max-archive-compression-ratio: ${LAREX_BACKUP_MAX_ARCHIVE_COMPRESSION_RATIO:200}
  dataset-releases:
    share-public-base-url: ${LAREX_DATASET_RELEASE_SHARE_PUBLIC_BASE_URL:${cors.allowed-origin}/api/public/dataset-releases}
  project-releases:
    share-public-base-url: ${LAREX_PROJECT_RELEASE_SHARE_PUBLIC_BASE_URL:${cors.allowed-origin}/api/public/project-releases}
  action-outputs:
    share-public-base-url: ${LAREX_ACTION_OUTPUT_SHARE_PUBLIC_BASE_URL:${cors.allowed-origin}/api/public/action-outputs}
  actions:
    public-base-url: ${LAREX_ACTIONS_PUBLIC_BASE_URL:}
    public-base-url-allowed-origins: ${LAREX_ACTIONS_PUBLIC_BASE_URL_ALLOWED_ORIGINS:${cors.allowed-origin}}
    public-base-url-require-https: ${LAREX_ACTIONS_PUBLIC_BASE_URL_REQUIRE_HTTPS:true}
    endpoint-allowed-origins: ${LAREX_ACTIONS_ENDPOINT_ALLOWED_ORIGINS:}
    endpoint-require-https: ${LAREX_ACTIONS_ENDPOINT_REQUIRE_HTTPS:true}
    endpoint-allow-insecure-local: ${LAREX_ACTIONS_ENDPOINT_ALLOW_INSECURE_LOCAL:true}
    endpoint-secret-encryption-key: ${LAREX_ACTION_ENDPOINT_SECRET_ENCRYPTION_KEY:}
    endpoint-secrets: {}
    results:
      max-file-bytes: ${LAREX_ACTION_RESULT_MAX_FILE_BYTES:104857600}
      max-total-bytes: ${LAREX_ACTION_RESULT_MAX_TOTAL_BYTES:503316480}
  error-log:
    retention-days: ${LAREX_ERROR_LOG_RETENTION_DAYS:30}
    stack-trace-max-length: ${LAREX_ERROR_LOG_STACK_TRACE_MAX_LENGTH:16000}

cors:
  allowed-origin: http://larex.localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
