larex:
  actions:
    endpoint-secret-encryption-key: ${LAREX_ACTION_ENDPOINT_SECRET_ENCRYPTION_KEY:dev-action-endpoint-secret-encryption-key-change-me}
    endpoint-secrets:
      mock-processor-v1: ${LAREX_ACTION_ENDPOINT_SECRET_MOCK_PROCESSOR_V1:dev-mock-action-secret-change-me}
      kraken-segmentation-v1: ${LAREX_ACTION_ENDPOINT_SECRET_KRAKEN_SEGMENTATION_V1:dev-kraken-action-secret-change-me}
      kraken-layout-training-v1: ${LAREX_ACTION_ENDPOINT_SECRET_KRAKEN_LAYOUT_TRAINING_V1:dev-kraken-training-action-secret-change-me}
    dev:
      mock-processor:
        enabled: ${LAREX_DEV_MOCK_ACTION_ENABLED:true}
        endpoint-url: ${LAREX_DEV_MOCK_ACTION_ENDPOINT_URL:http://mock-action-processor:9000/dispatch}
        health-url: ${LAREX_DEV_MOCK_ACTION_HEALTH_URL:http://mock-action-processor:9000/health}
        preflight-url: ${LAREX_DEV_MOCK_ACTION_PREFLIGHT_URL:http://mock-action-processor:9000/preflight}
      mock-training-processor:
        enabled: ${LAREX_DEV_MOCK_TRAINING_ACTION_ENABLED:true}
        endpoint-url: ${LAREX_DEV_MOCK_TRAINING_ACTION_ENDPOINT_URL:http://mock-action-processor:9000/training/dispatch}
        health-url: ${LAREX_DEV_MOCK_TRAINING_ACTION_HEALTH_URL:http://mock-action-processor:9000/training/health}
        preflight-url: ${LAREX_DEV_MOCK_TRAINING_ACTION_PREFLIGHT_URL:http://mock-action-processor:9000/training/preflight}
      kraken-processor:
        enabled: ${LAREX_DEV_KRAKEN_ACTION_ENABLED:false}
        endpoint-url: ${LAREX_DEV_KRAKEN_ACTION_ENDPOINT_URL:http://action-kraken-segmentation:9000/dispatch}
        health-url: ${LAREX_DEV_KRAKEN_ACTION_HEALTH_URL:http://action-kraken-segmentation:9000/health}
        preflight-url: ${LAREX_DEV_KRAKEN_ACTION_PREFLIGHT_URL:http://action-kraken-segmentation:9000/preflight}
      kraken-training-processor:
        enabled: ${LAREX_DEV_KRAKEN_TRAINING_ACTION_ENABLED:false}
        endpoint-url: ${LAREX_DEV_KRAKEN_TRAINING_ACTION_ENDPOINT_URL:http://action-kraken-layout-training:9000/dispatch}
        health-url: ${LAREX_DEV_KRAKEN_TRAINING_ACTION_HEALTH_URL:http://action-kraken-layout-training:9000/health}
        preflight-url: ${LAREX_DEV_KRAKEN_TRAINING_ACTION_PREFLIGHT_URL:http://action-kraken-layout-training:9000/preflight}
