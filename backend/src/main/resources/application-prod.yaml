spring:
  application:
    name: backend
  mvc:
    servlet:
      path: /api/v1
  servlet:
    multipart:
      enabled: true
      location: ${larex.upload.temp-directory:${file.upload-dir}/temp}
      max-file-size: ${LAREX_ACTION_RESULT_MAX_FILE_BYTES:104857600}
      max-request-size: ${LAREX_ACTION_RESULT_MAX_TOTAL_BYTES:503316480}
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:larex_backend}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        type:
          json_format_mapper: de.uniwue.zpd.dachs.larex.backend.config.ToolsJacksonJsonFormatMapper
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/larex-prod
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

keycloak:
  resource-client-id: ${KEYCLOAK_RESOURCE_CLIENT_ID}
  admin:
    server-url: http://keycloak:8080
    realm: larex-prod
    client-id: larex-backend-service
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    action-email:
      client-id: ${KEYCLOAK_ACTION_EMAIL_CLIENT_ID:larex-frontend}
      redirect-uri: ${KEYCLOAK_ACTION_EMAIL_REDIRECT_URI:http://localhost:3000/auth/keycloak}
      lifespan-seconds: ${KEYCLOAK_ACTION_EMAIL_LIFESPAN_SECONDS:43200}

file:
  upload-dir: ${LAREX_UPLOAD_DIR:/mnt/data/uploads}

larex:
  auth:
    user-provisioning-mode: ${LAREX_USER_PROVISIONING_MODE:LOCAL}
  project-packages:
    archive:
      max-archive-bytes: ${LAREX_PROJECT_PACKAGE_MAX_ARCHIVE_BYTES:134217728}
      max-entries: ${LAREX_PROJECT_PACKAGE_MAX_ENTRIES:100000}
      max-entry-bytes: ${LAREX_PROJECT_PACKAGE_MAX_ENTRY_BYTES:536870912}
      max-total-bytes: ${LAREX_PROJECT_PACKAGE_MAX_TOTAL_BYTES:2147483648}
      max-descriptor-bytes: ${LAREX_PROJECT_PACKAGE_MAX_DESCRIPTOR_BYTES:16777216}
      max-compression-ratio: ${LAREX_PROJECT_PACKAGE_MAX_COMPRESSION_RATIO:200}
    preview:
      max-cached-bytes: ${LAREX_PROJECT_PACKAGE_PREVIEW_MAX_CACHED_BYTES:4294967296}
      max-sessions: ${LAREX_PROJECT_PACKAGE_PREVIEW_MAX_SESSIONS:64}
      expire-after-minutes: ${LAREX_PROJECT_PACKAGE_PREVIEW_EXPIRE_MINUTES:30}
  upload:
    temp-directory: ${LAREX_UPLOAD_TEMP_DIR:${file.upload-dir}/temp}
    indexing:
      stale-threshold-ms: ${LAREX_UPLOAD_INDEXING_STALE_THRESHOLD_MS:60000}
    directories:
      root-directory: ${file.upload-dir}
      temp-directory: ${larex.upload.temp-directory}
      create-if-missing: ${LAREX_UPLOAD_CREATE_IF_MISSING:true}
      verify-writable: ${LAREX_UPLOAD_VERIFY_WRITABLE:true}
      fail-fast: ${LAREX_UPLOAD_STARTUP_FAIL_FAST:true}
  actions:
    public-base-url: ${LAREX_ACTIONS_PUBLIC_BASE_URL:}
    public-base-url-allowed-origins: ${LAREX_ACTIONS_PUBLIC_BASE_URL_ALLOWED_ORIGINS:${cors.allowed-origin}}
    public-base-url-require-https: ${LAREX_ACTIONS_PUBLIC_BASE_URL_REQUIRE_HTTPS:true}
    endpoint-allowed-origins: ${LAREX_ACTIONS_ENDPOINT_ALLOWED_ORIGINS:}
    endpoint-require-https: ${LAREX_ACTIONS_ENDPOINT_REQUIRE_HTTPS:true}
    endpoint-allow-insecure-local: ${LAREX_ACTIONS_ENDPOINT_ALLOW_INSECURE_LOCAL:true}
    endpoint-secret-encryption-key: ${LAREX_ACTION_ENDPOINT_SECRET_ENCRYPTION_KEY:}
  backup:
    enabled: ${LAREX_BACKUP_ENABLED:true}
    allowed-paths: ${LAREX_BACKUP_ALLOWED_PATHS:/mnt/data,/mnt/data/backups}
    output-dir: ${LAREX_BACKUP_OUTPUT_DIR:/mnt/data/backups}
    max-files-per-job: ${LAREX_BACKUP_MAX_FILES:500000}
  error-log:
    retention-days: ${LAREX_ERROR_LOG_RETENTION_DAYS:30}
    stack-trace-max-length: ${LAREX_ERROR_LOG_STACK_TRACE_MAX_LENGTH:16000}

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
