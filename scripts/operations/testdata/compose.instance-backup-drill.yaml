services:
  postgres:
    image: postgres:18.2-alpine
    environment:
      POSTGRES_DB: larex_drill
      POSTGRES_USER: larex_drill
      POSTGRES_PASSWORD: larex_drill
    volumes:
      - drill_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U larex_drill -d larex_drill"]
      interval: 2s
      timeout: 2s
      retries: 20

  app:
    image: postgres:18.2-alpine
    command: ["sh", "-c", "trap 'exit 0' TERM INT; while :; do sleep 1; done"]
    volumes:
      - drill_app_data:/mnt/data
    depends_on:
      postgres:
        condition: service_healthy

  keycloak-postgres:
    image: postgres:18.2-alpine
    environment:
      POSTGRES_DB: keycloak_drill
      POSTGRES_USER: keycloak_drill
      POSTGRES_PASSWORD: keycloak_drill
    volumes:
      - drill_keycloak_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_drill -d keycloak_drill"]
      interval: 2s
      timeout: 2s
      retries: 20

  keycloak:
    image: postgres:18.2-alpine
    command: ["sh", "-c", "trap 'exit 0' TERM INT; while :; do sleep 1; done"]
    volumes:
      - drill_keycloak_data:/opt/keycloak/data
    depends_on:
      keycloak-postgres:
        condition: service_healthy

volumes:
  drill_postgres:
  drill_app_data:
  drill_keycloak_postgres:
  drill_keycloak_data:
