# Server Configuration
server.port=8080
server.servlet.context-path=/
server.servlet.session.timeout=300m

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Multipart/File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=2KB

# Logging Configuration
logging.level.root=ERROR
logging.level.de.uniwue=DEBUG
logging.file.name=${user.home}/larex.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%-5level][%logger{36}] %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%-5level][%logger{36}] %msg%n

# Error Pages
server.error.whitelabel.enabled=false
server.error.path=/error

# Character Encoding
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Static Resources
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:src/main/webapp/resources/

