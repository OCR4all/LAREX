version: 1
id: kraken-segmentation
name: Kraken Segmentation
description: Runs Kraken OCR baseline segmentation and incrementally imports PAGE XML.
tags: [layout, segmentation]
targets:
  - PAGE
  - REGION

endpoint:
  url: http://action-kraken-segmentation:9000/dispatch
  healthUrl: http://action-kraken-segmentation:9000/health
  preflightUrl: http://action-kraken-segmentation:9000/preflight
  timeoutSeconds: 30
  auth:
    type: hmac
    secretRef: kraken-segmentation-v1

access:
  execute: CURATOR

locking:
  mode: PAGES

inputs:
  images:
    level: required
  xml:
    level: optional
    requiredForTargets:
      - REGION

outputs:
  xml:
    enabled: true
    overwrites:
      PAGE: [REGIONS, READING_ORDER]
      REGION: [TEXT_LINES]
  images:
    enabled: false

concurrency:
  maxActiveRuns: 1
  scope: PROJECT
