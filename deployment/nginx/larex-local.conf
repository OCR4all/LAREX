map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 1800s;
proxy_send_timeout 1800s;

server {
    listen 80 default_server;
    server_name _;

    location = /nginx-health {
        access_log off;
        return 200;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name larex.localhost;
    client_max_body_size 500m;

    location /api/upload-proxy/ {
        proxy_request_buffering off;
        proxy_buffering off;
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
    }
}

server {
    listen 80;
    server_name keycloak.localhost;

    location / {
        set $keycloak_upstream http://keycloak:8080;
        proxy_pass $keycloak_upstream;
    }
}

server {
    listen 80;
    server_name mail.localhost;

    location / {
        set $mailpit_upstream http://mailpit:8025;
        proxy_pass $mailpit_upstream;
    }
}

server {
    listen 80;
    server_name docs.localhost;

    location / {
        set $docs_upstream http://docs:3000;
        proxy_pass $docs_upstream;
    }
}
