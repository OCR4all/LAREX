services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    environment:
      CONTAINERS: 1
      EVENTS: 1
      SERVICES: 1
      SWARM: 0
      NETWORKS: 1
      TASKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy
    restart: unless-stopped

  traefik:
    image: traefik:v3.6.8
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "${LAREX_LOCAL_BIND_IP:-127.0.0.1}:80:80"
      - "${LAREX_LOCAL_BIND_IP:-127.0.0.1}:8081:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - default
      - socket-proxy
    depends_on:
      - socket-proxy
    restart: unless-stopped

  postgres:
    image: postgres:18.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: larexdb
      POSTGRES_USER: ${POSTGRES_USER:-larex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-larex_dev_pw}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-larex} -d larexdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.4
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/larexdb
      KC_DB_USERNAME: ${POSTGRES_USER:-larex}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-larex_dev_pw}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-keycloak.localhost}
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_FRONTEND_URL: ${KEYCLOAK_FRONTEND_URL:-http://keycloak.localhost}
      KC_HEALTH_ENABLED: true
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./config/keycloak/dev.realm.json:/opt/keycloak/data/import/dev.realm.json:ro
      - ./config/keycloak/theme.jar:/opt/keycloak/providers/larex_theme.jar:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`keycloak.localhost`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

  mailpit:
    image: axllent/mailpit:v1.29.1
    restart: unless-stopped
    ports:
      - "${LAREX_LOCAL_BIND_IP:-127.0.0.1}:8025:8025"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`mail.localhost`)"
      - "traefik.http.routers.mailpit.entrypoints=web"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"

  app:
    build:
      context: backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_USER: ${POSTGRES_USER:-larex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-larex_dev_pw}
      KEYCLOAK_RESOURCE_CLIENT_ID: ${KEYCLOAK_RESOURCE_CLIENT_ID:-larex-backend}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-PLEASE_CHANGE_IN_PRODUCTION}
      KEYCLOAK_ADMIN_SERVER_URL: ${KEYCLOAK_ADMIN_SERVER_URL:-http://keycloak:8080}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM:-larex-dev}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:-http://keycloak.localhost/realms/larex-dev}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:-http://keycloak:8080/realms/larex-dev/protocol/openid-connect/certs}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://larex.localhost}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@larex.localhost}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
    volumes:
      - app_data:/mnt/data
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health || true); [ \"$$code\" = \"200\" ] || [ \"$$code\" = \"401\" ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8080"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?required}
      NUXT_API_BASE_INTERNAL: ${NUXT_API_BASE_INTERNAL:-http://app:8080/api/v1}
      NUXT_OAUTH_KEYCLOAK_SERVER_URL: ${NUXT_OAUTH_KEYCLOAK_SERVER_URL:-http://keycloak.localhost}
      NUXT_OAUTH_KEYCLOAK_SERVER_URL_INTERNAL: ${NUXT_OAUTH_KEYCLOAK_SERVER_URL_INTERNAL:-http://keycloak.localhost}
      NUXT_OAUTH_KEYCLOAK_REALM: ${NUXT_OAUTH_KEYCLOAK_REALM:-larex-dev}
      NUXT_OAUTH_KEYCLOAK_CLIENT_ID: ${NUXT_OAUTH_KEYCLOAK_CLIENT_ID:-larex-frontend}
      NUXT_OAUTH_KEYCLOAK_CLIENT_SECRET: ${NUXT_OAUTH_KEYCLOAK_CLIENT_SECRET:-PLEASE_CHANGE_IN_PRODUCTION}
      NUXT_OAUTH_KEYCLOAK_REDIRECT_URL: ${NUXT_OAUTH_KEYCLOAK_REDIRECT_URL:-http://larex.localhost/auth/keycloak}
    depends_on:
      app:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health/backend').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`larex.localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    extra_hosts:
      - "keycloak.localhost:host-gateway"

volumes:
  postgres_data:
  keycloak_data:
  app_data:

networks:
  socket-proxy:
    driver: bridge
