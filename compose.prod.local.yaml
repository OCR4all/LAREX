name: larex-prod-local

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${LAREX_BIND_IP:-127.0.0.1}:80:80"
    volumes:
      - ./deployment/nginx/larex-local.conf:/etc/nginx/conf.d/default.conf:ro,Z
    networks:
      - default
    depends_on:
      frontend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.29.1
    restart: unless-stopped
    ports:
      - "${LAREX_BIND_IP:-127.0.0.1}:8025:8025"

  keycloak:
    environment:
      KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:-keycloak_dev_pw}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://keycloak.localhost
      KC_HOSTNAME_STRICT: ${KEYCLOAK_HOSTNAME_STRICT:-true}
      KC_HOSTNAME_STRICT_HTTPS: ${KEYCLOAK_HOSTNAME_STRICT_HTTPS:-false}
      KEYCLOAK_FRONTEND_URL: http://keycloak.localhost
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_REALM:-larex-local}
      NUXT_OAUTH_KEYCLOAK_REDIRECT_URL: ${NUXT_OAUTH_KEYCLOAK_REDIRECT_URL:-http://larex.localhost/auth/keycloak}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://larex.localhost}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@larex.localhost}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL_ENABLE:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      KEYCLOAK_SMTP_FROM_DISPLAY_NAME: ${KEYCLOAK_SMTP_FROM_DISPLAY_NAME:-${LAREX_INSTANCE_NAME:-LAREX Local}}
    networks:
      - backend
      - default
    depends_on:
      mailpit:
        condition: service_started

  keycloak-postgres:
    environment:
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:-keycloak_dev_pw}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_POSTGRES_USER:-keycloak} -d ${KEYCLOAK_POSTGRES_DB:-keycloak}"]

  app:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-larex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-larex_dev_pw}
      KEYCLOAK_ACTION_EMAIL_REDIRECT_URI: ${KEYCLOAK_ACTION_EMAIL_REDIRECT_URI:-http://larex.localhost/auth/keycloak}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_REALM:-larex-local}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:-http://keycloak.localhost/realms/${KEYCLOAK_REALM:-larex-local}}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:-http://keycloak:8080/realms/${KEYCLOAK_REALM:-larex-local}/protocol/openid-connect/certs}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://larex.localhost}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@larex.localhost}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL_ENABLE:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
    depends_on:
      mailpit:
        condition: service_started

  frontend:
    environment:
      NUXT_OAUTH_KEYCLOAK_SERVER_URL: ${NUXT_OAUTH_KEYCLOAK_SERVER_URL:-http://keycloak.localhost}
      NUXT_OAUTH_KEYCLOAK_SERVER_URL_INTERNAL: ${NUXT_OAUTH_KEYCLOAK_SERVER_URL_INTERNAL:-http://keycloak:8080}
      NUXT_OAUTH_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-larex-local}
      NUXT_OAUTH_KEYCLOAK_REDIRECT_URL: ${NUXT_OAUTH_KEYCLOAK_REDIRECT_URL:-http://larex.localhost/auth/keycloak}
    networks:
      - backend
      - default

  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-larex_backend}
      POSTGRES_USER: ${POSTGRES_USER:-larex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-larex_dev_pw}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-larex} -d ${POSTGRES_DB:-larex_backend}"]

networks:
  backend:
    driver: bridge
