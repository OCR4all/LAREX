name: larex-prod-local

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    environment:
      CONTAINERS: 1
      EVENTS: 1
      SERVICES: 1
      SWARM: 0
      NETWORKS: 1
      TASKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy
    restart: unless-stopped

  traefik:
    image: traefik:v3.6.10
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "${LAREX_BIND_IP:-127.0.0.1}:80:80"
      - "${LAREX_BIND_IP:-127.0.0.1}:8081:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - default
      - socket-proxy
    depends_on:
      - socket-proxy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.29.1
    restart: unless-stopped
    ports:
      - "${LAREX_BIND_IP:-127.0.0.1}:8025:8025"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`mail.localhost`)"
      - "traefik.http.routers.mailpit.entrypoints=web"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"

  keycloak:
    environment:
      KC_DB_USERNAME: ${POSTGRES_USER:-larex}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-larex_dev_pw}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://keycloak.localhost
      KC_HOSTNAME_STRICT: ${KEYCLOAK_HOSTNAME_STRICT:-true}
      KC_HOSTNAME_STRICT_HTTPS: ${KEYCLOAK_HOSTNAME_STRICT_HTTPS:-false}
      KEYCLOAK_FRONTEND_URL: http://keycloak.localhost
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_REALM:-larex-local}
      NUXT_OAUTH_KEYCLOAK_REDIRECT_URL: ${NUXT_OAUTH_KEYCLOAK_REDIRECT_URL:-http://larex.localhost/auth/keycloak}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://larex.localhost}
    networks:
      - backend
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`keycloak.localhost`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

  app:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-larex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-larex_dev_pw}
      KEYCLOAK_ACTION_EMAIL_REDIRECT_URI: ${KEYCLOAK_ACTION_EMAIL_REDIRECT_URI:-http://larex.localhost/auth/keycloak}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_REALM:-larex-local}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:-http://keycloak.localhost/realms/${KEYCLOAK_REALM:-larex-local}}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:-http://keycloak:8080/realms/${KEYCLOAK_REALM:-larex-local}/protocol/openid-connect/certs}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://larex.localhost}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@larex.localhost}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL_ENABLE:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
    depends_on:
      mailpit:
        condition: service_started

  frontend:
    environment:
      NUXT_OAUTH_KEYCLOAK_SERVER_URL: ${NUXT_OAUTH_KEYCLOAK_SERVER_URL:-http://keycloak.localhost}
      NUXT_OAUTH_KEYCLOAK_SERVER_URL_INTERNAL: ${NUXT_OAUTH_KEYCLOAK_SERVER_URL_INTERNAL:-http://keycloak:8080}
      NUXT_OAUTH_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-larex-local}
      NUXT_OAUTH_KEYCLOAK_REDIRECT_URL: ${NUXT_OAUTH_KEYCLOAK_REDIRECT_URL:-http://larex.localhost/auth/keycloak}
    networks:
      - backend
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`larex.localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-larex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-larex_dev_pw}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-larex} -d larexdb"]

networks:
  backend:
    driver: bridge
  socket-proxy:
    driver: bridge
