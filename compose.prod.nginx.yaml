services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LAREX_PUBLIC_HOST: ${LAREX_PUBLIC_HOST:-app.example.org}
      KEYCLOAK_PUBLIC_HOST: ${KEYCLOAK_PUBLIC_HOST:-auth.example.org}
      KEYCLOAK_UPSTREAM: ${KEYCLOAK_UPSTREAM:-http://keycloak:8080}
    volumes:
      - ./deployment/nginx/templates/larex-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro,Z
      - ${NGINX_CERTS_DIR:-./deployment/nginx/certs}:/etc/nginx/certs:ro,Z
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge
